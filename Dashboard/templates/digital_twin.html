<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Twin (test)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #ffffff;
      color: #2c2c2a;
      padding: 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
    .sub { font-size: 0.85rem; color: #5f5e5a; margin: 0 0 16px; }
    .sub a { color: #185fa5; }
    #sketch-container {
      border-radius: 12px;
      overflow: hidden;
      border: 0.5px solid #d3d1c7;
      max-width: 500px;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; max-width: 500px; }
    button {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d3d1c7;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #eeedfe; }
    #conn-status { font-size: 0.75rem; margin-top: 8px; color: #5f5e5a; }
    #conn-status.live { color: #27500a; }
  </style>
</head>
<body>

<h1>Digital Twin</h1>
<p class="sub">Test visualization — listens to <code>new_detection</code> and <code>update_servo</code>.
  <a href="/">← Dashboard</a></p>

<div id="sketch-container"></div>
<div class="controls">
  <button type="button" onclick="triggerItem('canister')">Spawn Canister</button>
  <button type="button" onclick="triggerItem('chemical')">Spawn Chemical</button>
  <button type="button" onclick="triggerItem('applicator')">Spawn Applicator</button>
  <button type="button" onclick="triggerItem('inhaler')">Spawn Inhaler</button>
  <button type="button" onclick="triggerItem('unrecognized')">Spawn Unknown</button>
  <button type="button" onclick="triggerAll()">Spawn All</button>
</div>
<p id="conn-status">Connecting…</p>

<script>
// ── Removable test module: delete this file + /digital-twin route in app.py ──

const DISPLAY = {
  canister:     'Canister',
  chemical:     'Chemical',
  applicator:   'Applicator',
  inhaler:      'Inhaler',
  unrecognized: 'Unknown',
  unknown:      'Unknown',
  sharps:       'Chemical',
};

const KNOWN = new Set(['canister', 'chemical', 'applicator', 'inhaler', 'sharps']);

function normalizeCategory(raw) {
  const c = String(raw || '').toLowerCase();
  if (c === 'sharps') return 'chemical';
  if (c === 'unknown' || c === 'unrecognized') return 'unrecognized';
  return c;
}

function displayType(category) {
  return DISPLAY[normalizeCategory(category)] || 'Unknown';
}

const twinBus = { _h: {} };
twinBus.on = function(ev, fn) { this._h[ev] = fn; };
twinBus.emit = function(ev, data) {
  if (this._h[ev]) this._h[ev](data);
};

const socket = io();
const statusEl = document.getElementById('conn-status');

socket.on('connect', () => {
  statusEl.textContent = 'Live — receiving committed detections / update_servo';
  statusEl.classList.add('live');
});
socket.on('disconnect', () => {
  statusEl.textContent = 'Disconnected — manual buttons still work';
  statusEl.classList.remove('live');
});

socket.on('buffer_update', (data) => {
  if (!data || data.committed !== true) return;

  const rawCategory = data.winner || data.leader || data.category || '';
  const cat = normalizeCategory(rawCategory);
  if (!KNOWN.has(cat)) return;

  twinBus.emit('new_detection', {
    category: cat,
    label: displayType(cat),
    confidence: data.confidence,
    total_frames: data.total_frames,
  });
  simulateServoCycle(cat);
});
socket.on('update_servo', (data) => twinBus.emit('update_servo', data));

window.triggerItem = function(category) {
  const cat = normalizeCategory(category);
  twinBus.emit('new_detection', { category: cat, label: displayType(cat) });
  if (KNOWN.has(cat)) {
    simulateServoCycle(cat);
  }
};

window.triggerAll = function() {
  ['canister', 'chemical', 'applicator', 'inhaler'].forEach((cat, i) => {
    setTimeout(() => triggerItem(cat), i * 1300);
  });
};

function simulateServoCycle(category) {
  const arm = window._twinArms && window._twinArms.find(a => a.category === category);
  if (!arm) return;
  const framesToArm = (arm.x - 70 - 40) / 1;
  const msPerFrame = 1000 / 60;
  const openDelay = Math.max(0, framesToArm * msPerFrame - 120);
  const closeDelay = openDelay + 900;
  setTimeout(() => twinBus.emit('update_servo', { type: category, active: true }), openDelay);
  setTimeout(() => twinBus.emit('update_servo', { type: category, active: false }), closeDelay);
}

const armColors = {
  Canister:   { fill: '#B5D4F4', stroke: '#185FA5', text: '#0C447C' },
  Chemical:   { fill: '#F5C4B3', stroke: '#993C1D', text: '#712B13' },
  Applicator: { fill: '#C0DD97', stroke: '#3B6D11', text: '#27500A' },
  Inhaler:    { fill: '#EEEDFE', stroke: '#534AB7', text: '#3C3489' },
  Unknown:    { fill: '#E8E6DC', stroke: '#5F5E5A', text: '#2C2C2A' },
};

let conveyorSpeed = 1;
let arms = [];
let items = [];
const camera = { x: 70, y: 38, w: 48, h: 32 };
const CONVEYOR_TOP = 74;
const CONVEYOR_CENTER_Y = 100;

function getCameraSpawnPos() {
  const cameraBottom = camera.y + camera.h / 2;
  return { x: camera.x, y: (cameraBottom + CONVEYOR_TOP) / 2 };
}

new p5(function(p) {
  class ServoArm {
    constructor(x, y, label, category, channel, side) {
      this.x = x; this.y = y - 15;
      this.label = label;
      this.category = category;
      this.channel = channel;
      this.side = side;
      this.angle = p.PI / 2;
      this.targetAngle = p.PI / 2;
      this.isOpen = false;
    }
    open() {
      this.targetAngle = this.side === 'TR' ? p.PI / 10 : p.PI / 1.1;
      this.isOpen = true;
    }
    close() {
      this.targetAngle = p.PI / 2;
      this.isOpen = false;
    }
    tick() {
      this.angle = p.lerp(this.angle, this.targetAngle, 0.4);
    }
    display() {
      const col = armColors[this.label] || armColors.Unknown;
      p.push();
      p.translate(this.x, this.y);
      p.strokeWeight(5);
      p.stroke(col.stroke);
      p.push();
      p.rotate(this.angle);
      p.line(0, 0, 0, 45);
      p.fill(col.stroke);
      p.noStroke();
      p.ellipse(0, 45, 10, 10);
      p.pop();
      p.noStroke();
      p.fill(col.fill);
      this.side === 'TR'
        ? p.rect(-36, -40, 72, 20, 5)
        : p.rect(-36, +20, 72, 20, 5);
      p.fill(col.text);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(9);
      const ty = this.side === 'TR' ? -30 : 30;
      p.text(this.label + ' S' + this.channel, 0, ty);
      p.pop();
    }
  }

  const CONVEYOR_BOTTOM = 126;

  class MedicalDevice {
    constructor(x, y, type, arm) {
      this.x = x; this.y = y; this.type = type;
      this.arm = arm;
      this.w = 26; this.h = 26;
      this.state = 'conveyor';
      this.opacity = 255;
      this.vy = 0;
      this.settling = true;
    }
    update() {
      if (this.state === 'conveyor') {
        if (this.settling) {
          this.y = p.lerp(this.y, CONVEYOR_CENTER_Y, 0.12);
          if (Math.abs(this.y - CONVEYOR_CENTER_Y) < 0.5) {
            this.y = CONVEYOR_CENTER_Y;
            this.settling = false;
          }
        }
        this.x += conveyorSpeed;
        const arm = this.arm;
        if (arm && arm.isOpen && this.x >= arm.x - 20 && this.x <= arm.x + 25) {
          this.state = 'diverted';
          this.vy = arm.side === 'BL' ? 2.5 : -2.5;
        }
      } else if (this.state === 'diverted') {
        this.x += conveyorSpeed * 0.35;
        this.y += this.vy;
        const offBelt = this.y < CONVEYOR_TOP - this.h / 2 ||
                        this.y > CONVEYOR_BOTTOM + this.h / 2;
        if (offBelt) this.state = 'fading';
      } else if (this.state === 'fading') {
        this.x += conveyorSpeed * 0.2;
        this.y += this.vy * 0.4;
        this.opacity -= 6;
      }
    }
    isDone() {
      return this.state === 'fading' && this.opacity <= 0;
    }
    display() {
      const col = armColors[this.type] || armColors.Unknown;
      const fill = p.color(col.fill);
      const stroke = p.color(col.stroke);
      const text = p.color(col.text);
      fill.setAlpha(this.opacity);
      stroke.setAlpha(this.opacity);
      text.setAlpha(this.opacity);
      p.push();
      p.fill(fill);
      p.stroke(stroke);
      p.strokeWeight(1.5);
      p.rect(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h, 4);
      p.noStroke();
      p.fill(text);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(8);
      const tag = this.type === 'Unknown' ? '???' : this.type.substring(0, 3).toUpperCase();
      p.text(tag, this.x, this.y);
      p.pop();
    }
  }

  p.setup = function() {
    const cnv = p.createCanvas(500, 205);
    cnv.parent('sketch-container');

    arms.push(new ServoArm(200,  88, 'Canister',   'canister',   1, 'TR'));
    arms.push(new ServoArm(200, 138, 'Applicator',   'applicator',  2, 'BL'));
    arms.push(new ServoArm(400,  88, 'Chemical', 'chemical', 3, 'TR'));
    arms.push(new ServoArm(400, 138, 'Inhaler',    'inhaler',  4, 'BL'));
    window._twinArms = arms;

    twinBus.on('update_servo', function(data) {
      const cat = normalizeCategory(data.type);
      const arm = arms.find(a => a.category === cat);
      if (!arm) return;
      if (data.active) arm.open();
      else arm.close();
    });

    twinBus.on('new_detection', function(data) {
      const cat = normalizeCategory(data.category);
      const label = cat === 'unrecognized' ? 'Unknown' : (data.label || displayType(cat));
      const arm = KNOWN.has(cat) ? arms.find(a => a.category === cat) : null;
      const spawn = getCameraSpawnPos();
      items.push(new MedicalDevice(spawn.x, spawn.y, label, arm));
    });
  };

  p.draw = function() {
    p.background(245, 244, 240);
    drawConveyor();
    drawData(conveyorSpeed);
    drawCamera();
    for (const arm of arms) arm.tick();
    for (let i = items.length - 1; i >= 0; i--) {
      items[i].update();
      items[i].display();
      if (items[i].isDone() ||
          (items[i].state === 'conveyor' && items[i].x > p.width + 30)) {
        items.splice(i, 1);
      }
    }
    for (const arm of arms) arm.display();
  };

  function drawConveyor() {
    p.noStroke();
    p.fill(200, 215, 200);
    p.rect(0, 74, p.width, 52, 0);
    p.stroke(180, 155, 180);
    p.strokeWeight(1);
    for (let x = (p.frameCount * conveyorSpeed) % 40; x < p.width; x += 40) {
      p.line(x, 74, x, 126);
    }
    p.noStroke();
    p.fill(0, 80, 30);
    p.rect(0, 74, p.width, 5);
    p.rect(0, 121, p.width, 5);
    p.fill(80, 100, 80);
    p.textAlign(p.LEFT, p.CENTER);
    p.textSize(11);
    p.text('← ZONE DE TRI UV-C', 10, 140);
    p.stroke(220, 215, 200);
    p.strokeWeight(0.5);
    p.line(0, 110, p.width, 110);
  }
  function drawData(conveyorSpeed){
    p.textSize(11);
    p.textAlign(p.LEFT, p.CENTER);
    p.fill(40, 40, 45);
    p.noStroke();
    p.text("CONVEYOR SPEED: " + conveyorSpeed.toFixed(1) + " px/frame", 12, 185);
}


  function drawCamera() {
    const { x, y, w, h } = camera;
    const cameraBottom = y + h / 2;
    p.push();
    p.stroke(90, 95, 100);
    p.strokeWeight(1.5);
    p.fill(55, 60, 68);
    p.rect(x - w / 2, y - h / 2, w, h, 4);
    p.noStroke();
    p.fill(35, 40, 48);
    p.rect(x - w / 2 + 6, y - h / 2 + 6, w - 12, h - 12, 3);
    p.fill(20, 25, 32);
    p.circle(x, y + 2, 14);
    p.fill(80, 140, 200, 180);
    p.circle(x - 2, y, 5);
    p.fill(220, 225, 210);
    p.textAlign(p.CENTER, p.CENTER);
    p.textSize(10);
    p.text('YOLO', x, y - h / 2 - 8);
    p.stroke(120, 130, 140, 120);
    p.strokeWeight(1);
    p.line(x, cameraBottom, x, CONVEYOR_TOP);
    p.pop();
  }
}, document.getElementById('sketch-container'));
</script>
</body>
</html>
